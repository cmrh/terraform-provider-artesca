name: Acceptance Tests

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  acceptance:
    name: Acceptance Tests
    runs-on: cm-tf-provider-artesca
    env:
      TF_ACC: "1"
      TF_ACC_TERRAFORM_PATH: /usr/bin/tofu
      ARTESCA_MANAGEMENT_ENDPOINT: ${{ secrets.ARTESCA_MANAGEMENT_ENDPOINT }}
      ARTESCA_INSECURE_SKIP_VERIFY: "true"
      ARTESCA_OIDC_URL: ${{ secrets.ARTESCA_OIDC_URL }}
      ARTESCA_USERNAME: ${{ secrets.ARTESCA_USERNAME }}
      ARTESCA_PASSWORD: ${{ secrets.ARTESCA_PASSWORD }}
      ARTESCA_S3_ENDPOINT: ${{ secrets.ARTESCA_S3_ENDPOINT }}
      TF_VAR_ring_s3_endpoint: ${{ secrets.RING_S3_ENDPOINT }}
      TF_VAR_ring_s3_access_key: ${{ secrets.RING_S3_ACCESS_KEY }}
      TF_VAR_ring_s3_secret_key: ${{ secrets.RING_S3_SECRET_KEY }}
      TF_VAR_ring_s3_bucket_name: ${{ secrets.RING_S3_BUCKET_NAME }}
      TF_VAR_dest_ring_s3_endpoint: ${{ secrets.DEST_RING_S3_ENDPOINT }}
      TF_VAR_dest_ring_s3_access_key: ${{ secrets.DEST_RING_S3_ACCESS_KEY }}
      TF_VAR_dest_ring_s3_secret_key: ${{ secrets.DEST_RING_S3_SECRET_KEY }}
      TF_VAR_dest_ring_s3_bucket_name: ${{ secrets.DEST_RING_S3_BUCKET_NAME }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Download dependencies
        run: go mod download

      - name: Run acceptance tests
        run: make testacc
