name: govulncheck

# Weekly early warning for reachable known vulnerabilities in Go dependencies
# and the standard library, which new vulnerability-database entries can
# introduce without any change to the code. It doesn't run on PRs or pushes;
# the release workflow runs the same scan as the blocking gate.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.5.0
          govulncheck ./...
