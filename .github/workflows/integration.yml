name: Integration Tests

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  integration:
    name: Integration Tests
    runs-on: cm-tf-provider-artesca
    env:
      TF_ACC_TERRAFORM_PATH: /usr/bin/tofu
      TF_ACC_PROVIDER_NAMESPACE: cmrh
      # Use a workflow-local Terraform CLI config so the runner's user-level
      # ~/.terraformrc (which may hold unrelated dev overrides) is ignored.
      TF_CLI_CONFIG_FILE: ${{ github.workspace }}/.ci-terraformrc
      ARTESCA_MANAGEMENT_ENDPOINT: ${{ secrets.ARTESCA_MANAGEMENT_ENDPOINT }}
      ARTESCA_INSECURE_SKIP_VERIFY: "true"
      ARTESCA_OIDC_URL: ${{ secrets.ARTESCA_OIDC_URL }}
      ARTESCA_USERNAME: ${{ secrets.ARTESCA_USERNAME }}
      ARTESCA_PASSWORD: ${{ secrets.ARTESCA_PASSWORD }}
      ARTESCA_S3_ENDPOINT: ${{ secrets.ARTESCA_S3_ENDPOINT }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Build provider
        run: go build -o terraform-provider-artesca .

      - name: Write dev override
        run: |
          cat > "${TF_CLI_CONFIG_FILE}" <<EOF
          provider_installation {
            dev_overrides {
              "${TF_ACC_PROVIDER_NAMESPACE}/artesca" = "${{ github.workspace }}"
            }
            direct {}
          }
          EOF

      # Remove any stale .terraform.lock.hcl / .terraform dir surviving from a
      # prior run on this self-hosted runner. Dev overrides bypass the lock
      # file, but tofu still validates any lock it finds — a mismatch aborts
      # apply. Cleaning is safe because these are gitignored.
      - name: Clean stale tofu artifacts
        working-directory: tests/integration
        run: rm -rf .terraform .terraform.lock.hcl

      - name: Write tfvars
        working-directory: tests/integration
        run: |
          cat > integration.tfvars <<EOF
          test_suffix              = "${{ github.run_id }}"
          ring_s3_endpoint         = "${{ secrets.RING_S3_ENDPOINT }}"
          ring_s3_access_key       = "${{ secrets.RING_S3_ACCESS_KEY }}"
          ring_s3_secret_key       = "${{ secrets.RING_S3_SECRET_KEY }}"
          ring_s3_bucket_name      = "${{ secrets.RING_S3_BUCKET_NAME }}"
          dest_ring_s3_endpoint    = "${{ secrets.DEST_RING_S3_ENDPOINT }}"
          dest_ring_s3_access_key  = "${{ secrets.DEST_RING_S3_ACCESS_KEY }}"
          dest_ring_s3_secret_key  = "${{ secrets.DEST_RING_S3_SECRET_KEY }}"
          dest_ring_s3_bucket_name = "${{ secrets.DEST_RING_S3_BUCKET_NAME }}"
          EOF

      - name: Apply
        working-directory: tests/integration
        run: tofu apply -auto-approve -var-file=integration.tfvars

      - name: Plan (drift check)
        working-directory: tests/integration
        run: tofu plan -detailed-exitcode -var-file=integration.tfvars

      - name: Destroy
        if: always()
        working-directory: tests/integration
        run: tofu destroy -auto-approve -var-file=integration.tfvars
